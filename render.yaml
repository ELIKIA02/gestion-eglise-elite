services:
  - type: web
    name: gestion-eglise-elite
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MISTRAL_API_KEY
        sync: false
      - key: WA_AUTH_DATA
        sync: false
      - key: API_PORT
        value: 3001
