<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Application de gestion paroissiale complète — membres, trésorerie, cultes et communications" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>ELIKIA EKLESIA</title>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0F172A; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash-logo { width: 72px; height: 72px; margin-bottom: 16px; }
      #splash-name { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; color: #f1f5f9; }
      #splash-sub { font-size: 11px; color: #64748b; font-weight: 500; margin-bottom: 32px; text-transform: uppercase; letter-spacing: 1px; }
      .splash-bar-track { width: 200px; height: 3px; background: #1e293b; border-radius: 4px; overflow: hidden; }
      .splash-bar-fill { height: 100%; width: 30%; background: linear-gradient(90deg, #6366f1, #a855f7); border-radius: 4px; animation: splash-load 1.4s ease-in-out infinite; }
      @keyframes splash-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
    </style>
  </head>
  <body class="overscroll-none" style="margin:0">
    <div id="splash">
      <svg id="splash-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" fill="#1e293b" stroke="#334155" stroke-width="2"/>
        <rect x="35" y="32" width="30" height="36" rx="3" fill="#6366f1"/>
        <rect x="38" y="36" width="24" height="3" rx="1.5" fill="#c7d2fe"/>
        <rect x="38" y="42" width="20" height="2" rx="1" fill="#a5b4fc"/>
        <rect x="38" y="47" width="22" height="2" rx="1" fill="#a5b4fc"/>
        <rect x="38" y="52" width="14" height="2" rx="1" fill="#a5b4fc"/>
        <path d="M48 62 L50 72 L52 62" fill="#fbbf24"/>
        <rect x="47" y="72" width="6" height="4" rx="1" fill="#475569"/>
        <path d="M32 40 L50 24 L68 40" fill="none" stroke="#475569" stroke-width="1.5"/>
      </svg>
      <div id="splash-name">ELIKIA EKLESIA</div>
      <div id="splash-sub">Application paroissiale</div>
      <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
